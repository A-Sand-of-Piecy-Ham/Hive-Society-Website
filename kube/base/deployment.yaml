apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-site
  labels:
    app.kubernetes.io/name: hive-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-site
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's `node` user; numeric so the kubelet can verify runAsNonRoot
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: hive-site # placeholder; overlays rewrite name/tag via `images:`
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
