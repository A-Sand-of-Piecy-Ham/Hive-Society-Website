# k3d on your machine:
#   k3d cluster create hive -p "8081:80@loadbalancer"
#   docker build -t hive-site:dev . && k3d image import hive-site:dev -c hive
#   kubectl apply -k kube/overlays/local  ->  http://hive.localhost:8081
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: hive-site
    newName: hive-site
    newTag: dev
patches:
  - target: { kind: Ingress, name: hive-site }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hive.localhost
